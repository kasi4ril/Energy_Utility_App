openapi: 3.0.3
info:
  title: NESCO Enterprise Utility Platform API
  description: Core API Gateway for Grid Intelligence, Inter-Departmental Workflows, and Local AI Governance.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Core API Gateway
paths:
  /auth/login:
    post:
      summary: Staff Authentication Handshake
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successfully authenticated, returns 15-minute JWT
        '401':
          description: Invalid credentials or tampered HMAC signature

  /foundation/org-units:
    get:
      summary: List Organizational Units
      tags: [Foundation]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of registered organizational units
    post:
      summary: Register Organizational Unit
      tags: [Foundation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_code, name, unit_type]
              properties:
                unit_code: {type: string}
                name: {type: string}
                unit_type: {type: string, enum: [HQ, DISTRICT, SERVICE_UNIT, MASTER_STATION, GENERATING_PLANT]}
                parent_id: {type: string, format: uuid}
                latitude: {type: number}
                longitude: {type: number}
      responses:
        '201':
          description: Unit created
        '422':
          description: Administrative hierarchy violation

  /foundation/staff:
    get:
      summary: List Staff Profiles
      tags: [Foundation]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: org_unit_id
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: List of staff profiles
    post:
      summary: Register Staff Profile
      tags: [Foundation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff_number, full_name, email, password, role, org_unit_id]
              properties:
                staff_number: {type: string}
                full_name: {type: string}
                email: {type: string}
                password: {type: string}
                role: {type: string}
                org_unit_id: {type: string, format: uuid}
      responses:
        '201':
          description: Staff profile registered with row HMAC signature

  /foundation/staff/transfer:
    post:
      summary: Execute Staff Transfer
      tags: [Foundation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff_id, new_org_unit_id, new_role]
              properties:
                staff_id: {type: string, format: uuid}
                new_org_unit_id: {type: string, format: uuid}
                new_role: {type: string}
      responses:
        '200':
          description: Staff successfully transferred and re-signed

  /foundation/assets:
    get:
      summary: List Grid Assets
      tags: [Foundation]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: parent_id
          schema: {type: string, format: uuid}
        - in: query
          name: asset_type
          schema: {type: string}
      responses:
        '200':
          description: List of physical electrical assets
    post:
      summary: Register Grid Asset
      tags: [Foundation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_code, asset_type, org_unit_id, rated_capacity_kva, latitude, longitude]
              properties:
                asset_code: {type: string}
                asset_type: {type: string, enum: [PLANT, SUBSTATION_33KV, FEEDER_11KV, TRANSFORMER_DT, SERVICE_POLE, CUSTOMER_METER]}
                parent_asset_id: {type: string, format: uuid}
                org_unit_id: {type: string, format: uuid}
                rated_capacity_kva: {type: number}
                tariff_band: {type: string, enum: [A, B, C, D, E]}
                latitude: {type: number}
                longitude: {type: number}
      responses:
        '201':
          description: Asset registered with PostGIS geometry and HMAC signature
        '422':
          description: Grid topology violation

  /notes/{entityType}/{entityId}:
    get:
      summary: Get WorkNotes Stream for Entity
      tags: [WorkNotes]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: entityType
          required: true
          schema: {type: string}
        - in: path
          name: entityId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Chronological list of chained notes
    post:
      summary: Append Immutable WorkNote to Entity
      tags: [WorkNotes]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: entityType
          required: true
          schema: {type: string}
        - in: path
          name: entityId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author_staff_id, note_text]
              properties:
                author_staff_id: {type: string, format: uuid}
                tagged_unit_ids: {type: array, items: {type: string, format: uuid}}
                note_text: {type: string}
      responses:
        '201':
          description: Note appended with SHA-256 prev-hash link

  /maker-checker/request:
    post:
      summary: Submit Operational Change for AI Fraud Risk Scoring & Review
      tags: [MakerChecker]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, change_category, target_record_id, payload_json, justification]
              properties:
                module: {type: string}
                change_category: {type: string, enum: [TARIFF_BAND_CHANGE, DEBT_ADJUSTMENT, METER_SWAP, STORE_STOCK_EDIT, ALLOWANCE_OVERRIDE]}
                target_record_id: {type: string}
                payload_json: {type: string}
                justification: {type: string}
      responses:
        '201':
          description: Change request registered with AI risk score and reasoning

  /maker-checker/requests:
    get:
      summary: List Maker-Checker Requests
      tags: [MakerChecker]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
        - in: query
          name: module
          schema: {type: string}
      responses:
        '200':
          description: Filtered list of change requests

  /maker-checker/{id}/approve:
    post:
      summary: Approve Maker-Checker Change Request
      tags: [MakerChecker]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checker_note: {type: string}
      responses:
        '200':
          description: Request approved and cryptographic audit chain row appended
        '422':
          description: Maker self-approval violation or insufficient risk authorization

  /maker-checker/{id}/reject:
    post:
      summary: Reject Maker-Checker Change Request
      tags: [MakerChecker]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Request marked rejected

  /audit/chain/{tableName}/{recordId}:
    get:
      summary: Retrieve and Verify Cryptographic SHA-256 Audit Chain
      tags: [AuditChain]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tableName
          required: true
          schema: {type: string}
        - in: path
          name: recordId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Valid continuous audit chain returned
        '409':
          description: Cryptographic violation - audit chain hash mismatch detected

  /chat/message:
    post:
      summary: Send Community Message or Query @GridAssistant
      tags: [Chat]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_text]
              properties:
                channel_id: {type: string, default: general}
                message_text: {type: string}
      responses:
        '201':
          description: Message recorded; returns co-pilot reply if assistant was tagged

  /chat/messages:
    get:
      summary: List Channel Chat Messages
      tags: [Chat]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: channel_id
          schema: {type: string, default: general}
        - in: query
          name: limit
          schema: {type: integer, default: 50}
      responses:
        '200':
          description: Chronological list of channel messages

  /customers/onboard:
    post:
      summary: Anti-Ghost Customer Onboarding with DT Proximity Lock
      tags: [CustomerCare]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, phone, building_class, latitude, longitude, transformer_id, tariff_band]
              properties:
                full_name: {type: string}
                phone: {type: string}
                nin: {type: string}
                building_class: {type: string, enum: [RESIDENTIAL, COMMERCIAL, INDUSTRIAL, SPECIAL]}
                latitude: {type: number}
                longitude: {type: number}
                transformer_id: {type: string, format: uuid}
                meter_serial: {type: string}
                tariff_band: {type: string, enum: [BAND_A, BAND_B, BAND_C, BAND_D, BAND_E]}
      responses:
        '201':
          description: Customer successfully onboarded and assigned CIN / Account Number
        '400':
          description: Validation error or distance > 500m from assigned DT

  /customers:
    get:
      summary: List Registered Customers
      tags: [CustomerCare]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: transformer_id
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, default: 50}
      responses:
        '200':
          description: List of registered customers

  /customers/{id}:
    get:
      summary: Retrieve Customer Profile by UUID
      tags: [CustomerCare]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Customer profile found
        '404':
          description: Customer record not found

  /tickets:
    post:
      summary: Ingest Service Complaint with Direct SLA Routing
      tags: [Tickets]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, category, description, assigned_unit_id]
              properties:
                customer_id: {type: string, format: uuid}
                channel: {type: string, enum: [WALK_IN, PHONE_CALL, WHATSAPP, EMAIL, WEB_PORTAL, FIELD_REPORT]}
                category: {type: string, enum: [FEEDER_LINE_FAULT, TRANSFORMER_FUSE_BURNT, METER_FAULT, NEW_METER_INSTALL, BILLING_DISPUTE, OVERBILLING, GENERAL_INQUIRY]}
                description: {type: string}
                assigned_unit_id: {type: string, format: uuid}
      responses:
        '201':
          description: Service ticket generated with direct Unit Head and Dept Head routing

    get:
      summary: List Service Tickets
      tags: [Tickets]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: unit_id
          schema: {type: string, format: uuid}
        - in: query
          name: category
          schema: {type: string}
      responses:
        '200':
          description: Array of service tickets matching filters

  /tickets/{id}:
    get:
      summary: Retrieve Ticket by UUID
      tags: [Tickets]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Ticket details
        '404':
          description: Ticket not found

  /tickets/{id}/attend:
    post:
      summary: Technical Field Crew Submits Proof of Work
      tags: [Tickets]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof_note]
              properties:
                proof_note: {type: string}
      responses:
        '200':
          description: Ticket marked ATTENDED_TO with repair proof note

  /tickets/{id}/confirm-close:
    post:
      summary: Customer Care Officer Performs Two-Step Closure Verification
      tags: [Tickets]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, feedback]
              properties:
                confirmed: {type: boolean}
                feedback: {type: string}
      responses:
        '200':
          description: Ticket transitioned to CLOSED_RESOLVED or REOPENED_ESCALATED

  /meters/schedule:
    post:
      summary: Schedule Meter Installation or Inspection
      tags: [Metering]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, schedule_type, scheduled_date]
              properties:
                customer_id: {type: string, format: uuid}
                ticket_id: {type: string, format: uuid}
                schedule_type: {type: string, enum: [NEW_INSTALL, REPLACEMENT, RECERTIFICATION, TAMPER_INSPECTION]}
                scheduled_date: {type: string, format: date-time}
                assigned_metering_team_id: {type: string, format: uuid}
      responses:
        '201':
          description: Meter activity scheduled successfully

  /meters/schedules:
    get:
      summary: List Meter Activity Schedules
      tags: [Metering]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [PENDING_DISPATCH, FIELD_ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]}
      responses:
        '200':
          description: Array of scheduled meter activities

  /services/work-orders:
    post:
      summary: Dispatch Field Maintenance Work Order
      tags: [ServicesMaintenance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_type, work_order_type, priority, team_lead_id, asset_id, instructions]
              properties:
                ticket_id: {type: string, format: uuid}
                unit_type: {type: string, enum: [FEEDER_MAINT, TRANSFORMER_MAINT, METERING]}
                work_order_type: {type: string, enum: [CORRECTIVE_REPAIR, PREVENTIVE_MAINTENANCE, EMERGENCY_OUTAGE, METER_INSTALLATION, DT_INSPECTION]}
                priority: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
                team_lead_id: {type: string, format: uuid}
                asset_id: {type: string, format: uuid}
                ptw_required: {type: boolean}
                ptw_permit_id: {type: string, format: uuid}
                materials_requisition_ref: {type: string}
                instructions: {type: string}
      responses:
        '201':
          description: Work order created and dispatched to team lead
        '400':
          description: Validation error
        '422':
          description: Target asset not found or invalid business parameters

    get:
      summary: List Maintenance Work Orders
      tags: [ServicesMaintenance]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: unit
          schema: {type: string, enum: [FEEDER_MAINT, TRANSFORMER_MAINT, METERING]}
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: team_lead_id
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Array of maintenance work orders

  /services/work-orders/{id}:
    get:
      summary: Retrieve Work Order by UUID
      tags: [ServicesMaintenance]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Maintenance work order record
        '404':
          description: Work order not found

  /services/work-orders/{id}/proof:
    post:
      summary: Submit Field Proof of Work (Mobile PWA)
      tags: [ServicesMaintenance]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, before_photo_url, after_photo_url, photo_hash_before, photo_hash_after, work_details]
              properties:
                latitude: {type: number}
                longitude: {type: number}
                before_photo_url: {type: string}
                after_photo_url: {type: string}
                photo_hash_before: {type: string}
                photo_hash_after: {type: string}
                meter_seal_number: {type: string}
                work_details: {type: string}
      responses:
        '201':
          description: Field proof logged with AI GPS verification
        '400':
          description: Validation error
        '422':
          description: Anti-photo-reuse violation, unauthorized lead, or GPS out of tolerance

    get:
      summary: Retrieve Proof of Work Log
      tags: [ServicesMaintenance]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Proof of work log record
        '404':
          description: Proof record not found

  /services/work-orders/{id}/verify:
    post:
      summary: Unit Head Verification & Customer Care Reversion
      tags: [ServicesMaintenance]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, notes]
              properties:
                approved: {type: boolean}
                notes: {type: string}
      responses:
        '200':
          description: Work order transitioned to ATTENDED_VERIFIED or REJECTED_REWORK

  /generation/telemetry:
    post:
      summary: Log Plant Hydrological and Generator Telemetry
      tags: [Generation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id, shift_window, plant_id, plant_state, water_level_m, mw_generated]
              properties:
                shift_id: {type: string}
                shift_window: {type: string, enum: [MORNING, AFTERNOON, NIGHT]}
                plant_id: {type: string, format: uuid}
                plant_state: {type: string, enum: [IN_SERVICE, STANDBY, OUT_OF_SERVICE]}
                water_level_m: {type: number}
                headwater_elevation_m: {type: number}
                tailwater_elevation_m: {type: number}
                inflow_rate_m3_s: {type: number}
                mw_generated: {type: number}
                mvar_reactive: {type: number}
                stator_winding_temp_c: {type: number}
                bearing_vibration_mm_s: {type: number}
                lube_oil_pressure_bar: {type: number}
      responses:
        '201':
          description: Telemetry logged; returns early warning alerts if thresholds exceeded
        '400':
          description: Validation error
        '422':
          description: Physical boundary violation or asset not found

    get:
      summary: List Historical Generation Telemetry Logs
      tags: [Generation]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: shift_id
          schema: {type: string}
        - in: query
          name: plant_id
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, default: 50}
      responses:
        '200':
          description: Array of generation telemetry entries

  /generation/telemetry/latest/{plantId}:
    get:
      summary: Retrieve Most Recent Telemetry Entry for a Plant
      tags: [Generation]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: plantId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Latest plant telemetry reading
        '404':
          description: No telemetry found for plant

  /generation/rollcall:
    post:
      summary: Record Remote Plant Physical Shift Roll-Call
      tags: [Generation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id, shift_window, plant_id, operator_names, handover_notes]
              properties:
                shift_id: {type: string}
                shift_window: {type: string, enum: [MORNING, AFTERNOON, NIGHT]}
                plant_id: {type: string, format: uuid}
                operator_names: {type: array, items: {type: string}}
                protection_engineers: {type: array, items: {type: string}}
                technicians: {type: array, items: {type: string}}
                handover_notes: {type: string}
      responses:
        '201':
          description: Remote plant roll-call recorded

    get:
      summary: List Shift Roll-Calls across Plants 1–6
      tags: [Generation]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: shift_id
          schema: {type: string}
      responses:
        '200':
          description: Array of remote plant roll-call rosters

  /generation/faults:
    post:
      summary: Report Plant Fault and Request Workshop Fabrication
      tags: [Generation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plant_id, wing, fault_description]
              properties:
                plant_id: {type: string, format: uuid}
                wing: {type: string, enum: [ELECTRICAL, MECHANICAL]}
                fault_description: {type: string}
                severity: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
                requires_workshop: {type: boolean}
      responses:
        '201':
          description: Fault logged and escalated to GM / Workshop

    get:
      summary: List Plant Fault and Workshop Jobs
      tags: [Generation]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: plant_id
          schema: {type: string, format: uuid}
        - in: query
          name: wing
          schema: {type: string, enum: [ELECTRICAL, MECHANICAL]}
        - in: query
          name: status
          schema: {type: string}
      responses:
        '200':
          description: Array of plant fault and workshop jobs

  /generation/faults/{id}/gm-approval:
    post:
      summary: General Manager Material and Workshop Authorization Gate
      tags: [Generation]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, notes]
              properties:
                approved: {type: boolean}
                notes: {type: string}
      responses:
        '200':
          description: Job GM approval applied

  /generation/faults/{id}/workshop:
    post:
      summary: Advance Central Workshop Fabrication Status
      tags: [Generation]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workshop_status]
              properties:
                workshop_status: {type: string, enum: [PENDING_DISPATCH, MACHINING_IN_PROGRESS, WINDING_FABRICATION, QUALITY_CHECK, COMPLETED_DELIVERED, REJECTED]}
                store_requisition_ref: {type: string}

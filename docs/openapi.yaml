                unit_head_id: {type: string}
                team_lead_id: {type: string}
      responses:
        '201':
          description: Prognosis evaluated; automated work order created if critical

  /executive/predictive/transformer:
    post:
      summary: Evaluate Condition-Based Maintenance (CBM) for Transformers
      tags: [Predictive Maintenance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id]
              properties:
                asset_id: {type: string}
                load_pct: {type: number}
                top_oil_temp_c: {type: number}
                fuse_blows_30_days: {type: integer}
                unit_head_id: {type: string}
                team_lead_id: {type: string}
      responses:
        '201':
          description: Transformer CBM evaluated; inspection work order created if critical

  /executive/predictive/feeder:
    post:
      summary: Evaluate Feeder Fault Trip Probability & Vegetation Patrol Risk
      tags: [Predictive Maintenance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id]
              properties:
                asset_id: {type: string}
                trip_count_30_days: {type: integer}
                fault_density_per_km: {type: number}
                days_since_last_patrol: {type: number}
                storm_forecast: {type: boolean}
                unit_head_id: {type: string}
                team_lead_id: {type: string}
      responses:
        '201':
          description: Feeder reliability evaluated; patrol work order created if critical

  /executive/predictive/triggers:
    get:
      summary: List Predictive Maintenance Alarms
      tags: [Predictive Maintenance]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: model_name
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer}
      responses:
        '200':
          description: List of predictive triggers

  /executive/predictive/triggers/{id}/ack:
    post:
      summary: Acknowledge Predictive Maintenance Trigger Alarm
      tags: [Predictive Maintenance]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff_id]
              properties:
                staff_id: {type: string}
                status: {type: string}
      responses:
        '200':
          description: Trigger acknowledged
        '404':
          description: Trigger not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

